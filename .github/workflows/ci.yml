name: ci

on:
  push:
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Script tests
        run: |
          chmod +x scripts/*.sh test/scripts/*.test.sh
          make test-scripts

      - name: Mailbox tests + coverage
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .build/coverage.json

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          mkdir -p badges
          ./scripts/coverage-badge.sh .build/coverage.json badges/coverage.svg

      - name: Upload coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: badges/coverage.svg

  # Hosted Mac: compile the SwiftUI shell. Linux cannot see UIKit / GID / Photos.
  # Does not need an Apple ID. Unsigned Simulator build — not an installable IPA.
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unsigned Simulator build
        run: make ios

  badge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: badges

      - name: Push gh-pages (coverage badge)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BADGE="${GITHUB_WORKSPACE}/badges/coverage.svg"
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          if git fetch --depth 1 origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          cp "$BADGE" badges/coverage.svg
          touch .nojekyll

          git add -A
          if git diff --staged --quiet; then
            echo "No gh-pages change; skipping push."
          else
            git commit -m "chore: publish coverage badge [skip ci]"
            git push origin HEAD:gh-pages
          fi
