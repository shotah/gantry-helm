<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="The wheel. iPhone mouth for the crane. Same mailbox. Nothing inbound on the Mini.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="55%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="40%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5e4"/>
      <stop offset="45%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <symbol id="mini-gantry" viewBox="0 0 160 88">
      <rect x="8" y="78" width="144" height="10" rx="2" fill="url(#bed)" stroke="#44403c" stroke-width="1"/>
      <rect x="18" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="135" y="16" width="7" height="62" rx="1" fill="url(#post)"/>
      <rect x="12" y="10" width="136" height="12" rx="2" fill="url(#beam)"/>
      <rect x="18" y="13" width="124" height="3" rx="1" fill="#fafaf9" opacity="0.5"/>
      <rect x="66" y="8" width="28" height="16" rx="2" fill="#d6d3d1"/>
      <rect x="74" y="24" width="12" height="14" rx="1" fill="#a8a29e"/>
      <rect x="64" y="40" width="32" height="18" rx="3" fill="url(#chip)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="80" y="53" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6">MODEL</text>
    </symbol>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="640" cy="200" rx="300" ry="130" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="38" fill="#f59e0b" font-size="16" font-weight="700" letter-spacing="6">THE WHEEL</text>
    <text x="640" y="58" fill="#a8a29e" font-size="12" letter-spacing="3.2">SAME MAILBOX, SAME CRANE</text>
  </g>

  <rect x="0" y="348" width="1280" height="72" fill="url(#road)"/>
  <rect x="0" y="348" width="1280" height="4" fill="#44403c"/>
  <g stroke="#fde68a" stroke-width="3" stroke-dasharray="28 22" opacity="0.35" stroke-linecap="butt">
    <line x1="80" y1="384" x2="430" y2="384"/>
    <line x1="850" y1="384" x2="1200" y2="384"/>
  </g>
  <g stroke="#57534e" stroke-width="2" opacity="0.5">
    <line x1="40" y1="360" x2="1240" y2="360"/>
    <line x1="40" y1="408" x2="1240" y2="408"/>
  </g>

  <!-- Dash + windshield. The wheel is the product, not the seat. -->
  <g transform="translate(72,86)" filter="url(#soft)">
    <ellipse cx="168" cy="248" rx="150" ry="10" fill="#000" opacity="0.38"/>

    <path fill="#292524" stroke="#44403c" stroke-width="1.4" d="M8 168 L28 92 L308 88 L332 168 L318 212 L22 214 Z"/>
    <path fill="#0c0d10" d="M40 164 L54 102 L286 98 L304 164 Z"/>
    <path fill="#111827" opacity="0.55" d="M48 158 L60 108 L278 104 L294 158 Z"/>
    <rect x="18" y="164" width="296" height="10" rx="2" fill="url(#gold)" opacity="0.55"/>
    <rect x="22" y="200" width="288" height="14" rx="3" fill="#1c1917"/>

    <!-- CarPlay strip on the dash -->
    <rect x="196" y="176" width="92" height="22" rx="3" fill="#0c0d10" stroke="#34d399" stroke-width="1.5"/>
    <g fill="#34d399">
      <circle cx="208" cy="187" r="2.3"/>
      <circle cx="216" cy="187" r="2.3" opacity="0.5"/>
      <circle cx="224" cy="187" r="2.3" opacity="0.3"/>
    </g>
    <text x="250" y="191" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8">KIT</text>

    <!-- The wheel -->
    <g transform="translate(118,148)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="url(#rim)" stroke-width="14"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity="0.85"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#292524" stroke-width="2"/>
      <path d="M-8 -18 L8 -18 L14 8 L-14 8 Z" fill="#1c1917" stroke="#a8a29e" stroke-width="2"/>
      <rect x="-46" y="-7" width="38" height="10" rx="3" fill="#44403c"/>
      <rect x="8" y="-7" width="38" height="10" rx="3" fill="#44403c"/>
      <rect x="-7" y="8" width="14" height="36" rx="3" fill="#44403c"/>
      <circle cx="0" cy="0" r="16" fill="url(#hub)" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#34d399"/>
    </g>

    <!-- iPhone in a dash mount -->
    <g transform="translate(248,78)">
      <rect x="10" y="18" width="10" height="16" fill="#57534e"/>
      <rect x="0" y="0" width="58" height="112" rx="12" fill="#0c0d10" stroke="#e7e5e4" stroke-width="2.2"/>
      <rect x="20" y="5" width="18" height="4" rx="2" fill="#27272a"/>
      <rect x="6" y="14" width="46" height="86" rx="4" fill="#111827"/>
      <rect x="10" y="20" width="28" height="10" rx="3" fill="#292524"/>
      <rect x="22" y="34" width="24" height="10" rx="3" fill="#f59e0b" opacity="0.9"/>
      <rect x="10" y="48" width="32" height="10" rx="3" fill="#292524"/>
      <rect x="10" y="62" width="22" height="10" rx="3" fill="#44403c"/>
      <circle cx="29" cy="96" r="5" fill="#1c1917" stroke="#34d399" stroke-width="1.2"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="238" y="318" text-anchor="middle" fill="#e7e5e4" font-size="13" font-weight="700" letter-spacing="1.6">HELM</text>
    <text x="238" y="334" text-anchor="middle" fill="#a8a29e" font-size="10" letter-spacing="1.2">iPhone / CarPlay</text>
  </g>

  <g fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <path d="M360 176 c12 -9 22 -9 34 0"/>
    <path d="M366 188 c10 -7 18 -7 28 0"/>
    <path d="M372 200 c8 -5 14 -5 22 0"/>
  </g>

  <g transform="translate(520,132)" filter="url(#soft)">
    <polygon points="120,8 210,60 210,164 120,216 30,164 30,60" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="120,28 192,70 192,154 120,196 48,154 48,70" fill="#0c0d10"/>
    <g fill="#34d399">
      <circle cx="92" cy="108" r="4"/>
      <circle cx="120" cy="108" r="4" opacity="0.55"/>
      <circle cx="148" cy="108" r="4" opacity="0.35"/>
    </g>
    <text x="120" y="148" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">MAILBOX</text>
    <text x="120" y="168" text-anchor="middle" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">Durable Object</text>
  </g>

  <g filter="url(#soft)">
    <rect x="780" y="92" width="18" height="248" rx="3" fill="url(#post)"/>
    <rect x="1124" y="92" width="18" height="248" rx="3" fill="url(#post)"/>
    <rect x="764" y="80" width="394" height="24" rx="4" fill="url(#beam)"/>
    <rect x="780" y="86" width="362" height="6" rx="2" fill="#fafaf9" opacity="0.45"/>
  </g>

  <g transform="translate(918,78)">
    <rect x="0" y="0" width="64" height="16" rx="2" fill="#d6d3d1"/>
    <rect x="8" y="4" width="48" height="5" rx="1" fill="#78716c"/>
    <line x1="16" y1="16" x2="16" y2="38" stroke="#a8a29e" stroke-width="2.4"/>
    <line x1="48" y1="16" x2="48" y2="38" stroke="#a8a29e" stroke-width="2.4"/>
    <path d="M10 38 L16 46 L22 38" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M42 38 L48 46 L54 38" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" transform="translate(870,118)" filter="url(#soft)">
    <use xlink:href="#mini-gantry" href="#mini-gantry" x="4" y="0" width="160" height="88"/>
    <circle cx="18" cy="108" r="4" fill="#34d399"/>
    <text x="28" y="111" fill="#a8a29e" font-size="8" letter-spacing="0.4">ai-gantry</text>
    <text x="84" y="128" text-anchor="middle" fill="#e7e5e4" font-size="14" font-weight="700" letter-spacing="1.4">KIT</text>
  </g>

  <g fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75" stroke-linecap="round">
    <path d="M390 200 C450 168 500 150 548 176"/>
    <path d="M870 200 C800 168 740 156 732 176"/>
  </g>
  <polygon points="540,168 556,176 540,188" fill="#f59e0b" opacity="0.8"/>
  <polygon points="740,168 724,176 740,188" fill="#f59e0b" opacity="0.8"/>
  <text x="430" y="154" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">inbound frame</text>
  <text x="790" y="158" fill="#78716c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">wss in</text>

  <g fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M1048 248 c28 -16 50 -16 78 0"/>
    <path d="M1060 262 c22 -11 40 -11 64 0"/>
    <path d="M1072 276 c16 -8 28 -8 44 0"/>
  </g>
  <polygon points="1128,244 1144,248 1128,260" fill="#34d399" opacity="0.85"/>
  <text x="950" y="300" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">outbound</text>
  <text x="950" y="316" fill="#57534e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">zero inbound ports</text>

  <rect x="430" y="386" width="420" height="22" rx="4" fill="#0c0a09"/>
  <text x="640" y="401" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.4">nothing inbound on the Mini</text>
</svg>
