name: Helm
options:
  bundleIdPrefix: com.gantree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Mailbox:
    path: ..
targets:
  Helm:
    type: application
    platform: iOS
    sources:
      - Helm
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gantree.helm
        PRODUCT_NAME: Helm
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        HELM_MAILBOX_ORIGIN: ""
        HELM_GOOGLE_WEB_CLIENT_ID: ""
        HELM_GOOGLE_IOS_CLIENT_ID: ""
        HELM_GOOGLE_REVERSED_CLIENT_ID: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Mailbox
        product: Mailbox
